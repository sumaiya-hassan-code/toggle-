<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day Night Toggle</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="toggle">

        <!-- Sun -->
        <div class="sun"></div>

        <!-- Moon -->
        <div class="moon">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <!-- Clouds -->
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>

        <!-- Stars -->
        <div class="stars">
            <i>✦</i>
            <i>✦</i>
            <i>✦</i>
            <i>✦</i>
        </div>

    </div>

    <button id="toggleBtn">
        Switch to Night
    </button>

    <script src="js/script.js"></script>

</body>
</html>
